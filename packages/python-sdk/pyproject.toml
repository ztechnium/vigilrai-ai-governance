[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rai-control-plane-sdk"
version = "0.2.0"
description = "Official Python SDK for the RAI Control Plane governance API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ZTechnium", email = "opensource@ztechnium.com" }]
keywords = ["rai", "responsible-ai", "governance", "sdk", "control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "respx>=0.21.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ztechnium/rai-python-sdk"
Documentation = "https://github.com/ztechnium/rai-python-sdk#readme"
Repository = "https://github.com/ztechnium/rai-python-sdk"
Issues = "https://github.com/ztechnium/rai-python-sdk/issues"
Changelog = "https://github.com/ztechnium/rai-python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["rai_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
